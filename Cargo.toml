[package]
name = "powertoysroulette"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "0.8.0", features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1.0"
